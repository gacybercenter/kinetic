{%- set mdev_types = ','.join(mdev_type.keys()) %}
[DEFAULT]
compute_driver=libvirt.LibvirtDriver
[libvirt]
virt_type=kvm
[devices]
enabled_mdev_types = {{ mdev_types }}
{%- for type,bus in mdev_type.items() %}
[mdev_{{ type }}]
{%- set bus_ids = ','.join(bus) %}
device_addresses = {{ bus_ids }}
{% endfor %}